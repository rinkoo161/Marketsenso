<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MarketSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9;
          --dim:#8b949e; --green:#3fb950; --red:#f85149; --amber:#d29922;
          --blue:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg);
         font:13px/1.45 -apple-system, "SF Mono", Menlo, monospace; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           border-bottom:1px solid var(--border); position:sticky; top:0;
           background:var(--bg); z-index:5; }
  header h1 { font-size:15px; color:var(--blue); }
  header .stat { color:var(--dim); font-size:12px; }
  nav button { background:none; border:1px solid var(--border); color:var(--fg);
               padding:5px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on { border-color:var(--blue); color:var(--blue); }
  main { padding:14px 16px; max-width:1280px; margin:0 auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--border);
           white-space:nowrap; }
  th { color:var(--dim); font-weight:normal; position:sticky; top:47px;
       background:var(--bg); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .sev-high { color:var(--red); font-weight:bold; }
  .sev-medium { color:var(--amber); }
  .sev-low { color:var(--dim); }
  .stance-buy { color:var(--green); font-weight:bold; }
  .stance-accumulate { color:var(--green); }
  .stance-hold { color:var(--dim); }
  .stance-reduce, .stance-exit { color:var(--red); }
  .stance-suppressed { color:var(--red); text-decoration:line-through; }
  .bar { display:inline-block; height:8px; background:var(--blue);
         border-radius:2px; vertical-align:middle; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px;
          border:1px solid var(--border); font-size:11px; color:var(--dim); }
  .ok { color:var(--green); } .bad { color:var(--red); }
  details { margin:2px 0; }
  details summary { cursor:pointer; }
  .thesis { background:var(--panel); border:1px solid var(--border);
            border-radius:6px; padding:8px 12px; margin:6px 0;
            white-space:normal; max-width:900px; }
  .thesis h4 { font-size:12px; color:var(--dim); margin:6px 0 2px; }
  .thesis li { margin-left:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
          gap:12px; }
  .card { background:var(--panel); border:1px solid var(--border);
          border-radius:8px; padding:12px; }
  .card h3 { font-size:12px; color:var(--dim); margin-bottom:8px; }
  .big { font-size:22px; }
  .muted { color:var(--dim); }
  #err { color:var(--red); padding:8px 16px; display:none; }
</style>
</head>
<body>
<header>
  <h1>MarketSense</h1>
  <nav>
    <button data-tab="pulse" class="on">Pulse</button>
    <button data-tab="signals">Signals</button>
    <button data-tab="performance">Performance</button>
    <button data-tab="health">Health</button>
  </nav>
  <span class="stat" id="topstat">…</span>
  <span class="stat muted" id="clock"></span>
</header>
<div id="err"></div>
<main id="main">loading…</main>

<script>
const $ = (s) => document.querySelector(s);
let TAB = 'pulse';
const state = {};

async function j(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}
const fmt = (x, d=1) => x == null ? '–' : Number(x).toFixed(d);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- pulse ---------------- */
function renderPulse() {
  const evs = state.pulse || [], alerts = state.alerts || [];
  const rows = evs.map(e => `<tr>
    <td class="muted">${esc((e.event_at||'').slice(5,16).replace('T',' '))}</td>
    <td><b>${esc(e.symbol||'?')}</b></td>
    <td>${esc(e.category)}</td>
    <td class="num ${e.materiality>=8?'sev-high':e.materiality>=6?'sev-medium':''}">m${e.materiality}</td>
    <td class="num">${e.sentiment>0.15?'<span class="ok">+</span>':e.sentiment<-0.15?'<span class="bad">−</span>':'='}</td>
    <td style="white-space:normal;max-width:520px">${esc(e.summary)}
      ${e.link?` <a class="muted" href="${esc(e.link)}" target="_blank">doc</a>`:''}</td>
  </tr>`).join('');
  const arows = alerts.slice(0,12).map(a => `<div>
    <span class="sev-${a.severity}">[${a.severity}]</span>
    <b>${esc(a.symbol||'')}</b> ${esc(a.category)} — ${esc(a.message).slice(0,110)}
    <span class="muted">${esc((a.at||'').slice(5,16).replace('T',' '))}</span></div>`).join('');
  $('#main').innerHTML = `
    <div class="grid" style="margin-bottom:12px">
      <div class="card"><h3>Recent alerts</h3>${arows||'<span class="muted">none yet</span>'}</div>
    </div>
    <table><thead><tr><th>event at</th><th>symbol</th><th>category</th>
    <th>mat</th><th>dir</th><th>summary</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 class="muted">no high-materiality events in window</td></tr>'}</tbody></table>`;
}

/* ---------------- signals ---------------- */
function thesisHtml(t) {
  if (!t) return '';
  const li = (xs) => (xs||[]).map(x => `<li>${esc(x)}</li>`).join('');
  return `<div class="thesis">
    <h4>for</h4><ul>${li(t.for)||'<li class="muted">—</li>'}</ul>
    <h4>against</h4><ul>${li(t.against)||'<li class="muted">—</li>'}</ul>
    <h4>what changes the view</h4><div>${esc(t.view_changer)}</div>
    <h4>evidence</h4><div class="muted">scores ${esc(JSON.stringify(t.evidence?.score_ids||{}))}
      · filings ${esc(JSON.stringify((t.evidence?.event_filings||[]).slice(0,6)))}</div>
  </div>`;
}
function renderSignals() {
  const sigs = state.signals || [];
  const rows = sigs.map(s => `
    <tr>
      <td class="stance-${s.stance}">${esc(s.stance)}</td>
      <td class="num"><span class="bar" style="width:${s.conviction*0.6}px"></span> ${fmt(s.conviction)}</td>
      <td class="num muted">${fmt(s.confidence,2)}</td>
      <td><b>${esc(s.symbol)}</b></td>
      <td><span class="pill">${esc(s.risk_verdict)}</span></td>
      <td class="num">${s.size_pct??'–'}%</td>
      <td class="muted">${esc(s.horizon||'')}</td>
      <td class="num muted">${s.entry?fmt(s.entry[0],1)+'–'+fmt(s.entry[1],1):'–'}</td>
      <td class="num muted">${s.target?fmt(s.target[0],1)+'–'+fmt(s.target[1],1):'–'}</td>
      <td class="num">${fmt(s.invalidation,1)}</td>
      <td><details><summary class="muted">thesis</summary>${thesisHtml(s.thesis)}</details></td>
    </tr>`).join('');
  $('#main').innerHTML = `
    <table><thead><tr><th>stance</th><th>conviction</th><th>conf</th><th>symbol</th>
    <th>risk</th><th>size</th><th>horizon</th><th>entry</th><th>target</th>
    <th>stop</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------------- performance ---------------- */
function renderPerformance() {
  const p = state.performance || {};
  const stances = Object.keys(p);
  if (!stances.length) {
    $('#main').innerHTML = `<div class="card"><h3>Signal performance (observed)</h3>
      <div class="muted">No fully-elapsed measurement windows yet — the first
      1-week numbers land ~5 trading days after the first live signals
      (issued 2026-08-08). The reconstructed walk-forward backtest lives in
      evaluation/reports/backtest-2026-08-08.json.</div></div>`;
    return;
  }
  const win = ['1w','4w','12w'];
  const rows = stances.map(st => `<tr><td class="stance-${st}">${esc(st)}</td>` +
    win.map(w => {
      const b = p[st]?.[w];
      if (!b) return '<td class="muted num">–</td><td class="muted num">–</td><td class="muted num">–</td>';
      const cls = (b.avg_excess_pct??0) > 0 ? 'ok' : 'bad';
      return `<td class="num">${b.n}</td><td class="num ${cls}">${fmt(b.avg_excess_pct,2)}%</td>
              <td class="num">${fmt(b.hit_rate_pct,1)}%</td>`;
    }).join('') + '</tr>').join('');
  $('#main').innerHTML = `
    <table><thead><tr><th>stance</th>
      ${win.map(w=>`<th>n ${w}</th><th>excess ${w}</th><th>hit ${w}</th>`).join('')}
    </tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="margin-top:10px">Observed forward returns vs
    Nifty 500 for signals actually issued live. Reconstructed backtest:
    see evaluation/reports/.</p>`;
}

/* ---------------- health ---------------- */
function renderHealth() {
  const h = state.health || {}, feeds = state.feeds || [], st = state.stats || {};
  const frows = feeds.map(f => {
    const age = f.last_polled_at ? Math.round((Date.now() - new Date(f.last_polled_at))/1000) : null;
    return `<tr><td>${esc(f.feed)}</td><td class="pill">${esc(f.priority)}</td>
      <td class="num ${age>600?'bad':''}">${age==null?'never':age+'s ago'}</td>
      <td>${esc(f.last_status||'')}</td>
      <td class="num">${f.entries_new}</td>
      <td class="num ${f.consecutive_errors?'bad':''}">${f.consecutive_errors}</td></tr>`;
  }).join('');
  $('#main').innerHTML = `
    <div class="grid" style="margin-bottom:12px">
      <div class="card"><h3>System</h3>
        <div class="big ${h.status==='ok'?'ok':'bad'}">${esc(h.status||'?')}</div>
        <div class="muted">${(h.problems||[]).map(esc).join('<br>')||'no problems'}</div></div>
      <div class="card"><h3>Corpus</h3>
        <div>filings <b>${st.filings??'–'}</b> · events <b>${st.events??'–'}</b></div>
        <div>resolution <b>${st.resolved_pct??'–'}%</b></div>
        <div class="muted">docs: ${esc(JSON.stringify(st.documents||{}))}</div></div>
    </div>
    <table><thead><tr><th>feed</th><th>pri</th><th>last poll</th><th>status</th>
    <th>new</th><th>errs</th></tr></thead><tbody>${frows}</tbody></table>`;
}

/* ---------------- shell ---------------- */
const RENDER = {pulse: renderPulse, signals: renderSignals,
                performance: renderPerformance, health: renderHealth};

async function refresh() {
  try {
    const [health, stats] = await Promise.all([j('/health'), j('/api/stats')]);
    state.health = health; state.stats = stats;
    $('#topstat').innerHTML =
      `<span class="${health.status==='ok'?'ok':'bad'}">●</span> ` +
      `${stats.filings} filings · ${stats.events} events`;
    if (TAB === 'pulse') {
      [state.pulse, state.alerts] = await Promise.all(
        [j('/api/pulse?hours=48&min_materiality=5&limit=60'), j('/api/alerts?limit=20')]);
    } else if (TAB === 'signals') {
      state.signals = await j('/api/signals?limit=100');
    } else if (TAB === 'performance') {
      state.performance = await j('/api/performance');
    } else if (TAB === 'health') {
      state.feeds = await j('/api/feeds');
    }
    $('#err').style.display = 'none';
    RENDER[TAB]();
  } catch (e) {
    $('#err').textContent = 'fetch failed: ' + e.message;
    $('#err').style.display = 'block';
  }
  $('#clock').textContent = new Date().toLocaleTimeString();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x === b));
  refresh();
});
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
